pacity:1;transform:translateX(71px)}15.800%{opacity:0;transform:translateX(71px)}100.000%{opacity:0;transform:translateX(71px)}}@keyframes ap7{0.000%{opacity:0;transform:translateX(0)}23.000%{opacity:0;transform:translateX(0)}23.800%{opacity:1;transform:translateX(0)}31.000%{opacity:1;transform:translateX(71px)}31.800%{opacity:0;transform:translateX(71px)}100.000%{opacity:0;transform:translateX(71px)}}@keyframes ap8{0.000%{opacity:0;transform:translateX(0)}60.000%{opacity:0;transform:translateX(0)}60.800%{opacity:1;transform:translateX(0)}68.000%{opacity:1;transform:translateX(71px)}68.800%{opacity:0;transform:translateX(71px)}100.000%{opacity:0;transform:translateX(71px)}}@keyframes ap9{0.000%{opacity:0;transform:translateX(0)}73.000%{opacity:0;transform:translateX(0)}73.800%{opacity:1;transform:translateX(0)}79.000%{opacity:1;transform:translateX(24px)}82.000%{opacity:0;transform:translateX(24px) scale(2.6)}100.000%{opacity:0;transform:translateX(24px) scale(2.6)}}@keyframes ap10{0.000%{opacity:0;transform:translateY(-26px)}45.000%{opacity:0;transform:translateY(-26px)}49.500%{opacity:1;transform:translateY(0)}94.000%{opacity:1;transform:translateY(0)}98.000%{opacity:0;transform:translateY(0)}100.000%{opacity:0;transform:translateY(-26px)}}</style>
<rect width="1000" height="330" rx="22" fill="url(#bgm)"/><rect width="1000" height="330" rx="22" fill="url(#brush)"/><rect x=".5" y=".5" width="999" height="329" rx="22" fill="none" stroke="url(#rim)"/><text x="30" y="46" font-size="24" class="b">Two “medium” findings. One critical story.</text><text x="30" y="72" font-size="14" class="mut">FSV reads its own findings and names the chains that are worse together — and the cheapest link to cut.</text><line x1="286" y1="159.0" x2="365" y2="159.0" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round" style="animation:dash .8s linear infinite"/><path d="M365 151.0 l10 8 l-10 8" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" style=""/><line x1="631" y1="159.0" x2="710" y2="159.0" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round" style="animation:dash .8s linear infinite,ap5 10.0s linear infinite"/><path d="M710 151.0 l10 8 l-10 8" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" style="animation:ap5 10.0s linear infinite"/><rect x="30" y="100" width="250" height="118" rx="18" fill="#fff" style="animation:ap0 10.0s linear infinite" stroke="#fff" stroke-opacity=".14" stroke-width="1.6" fill-opacity=".05"/><path d="M66 134 l14 -14 l14 14 l-14 14 z M70 160 h20" stroke="#dcdce2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="142" font-size="18.5" class="b">Reflected XSS</text><text x="110" y="168" font-size="13" class="m mut">?q=&lt;script&gt;…</text><rect x="50" y="184" width="56" height="22" rx="11" fill="#dcdce2" fill-opacity=".15" stroke="#dcdce2" stroke-opacity=".6"/><text x="61" y="199.5" font-size="12" class="b" style="fill:#dcdce2" letter-spacing="1">HIGH</text><rect x="375" y="100" width="250" height="118" rx="18" fill="#fff" style="animation:ap1 10.0s linear infinite" stroke="#fff" stroke-opacity=".14" stroke-width="1.6" fill-opacity=".05"/><circle cx="425" cy="136" r="15" stroke="#dcdce2" stroke-width="3" fill="none"/><circle cx="419" cy="131" r="2.6" fill="#dcdce2"/><circle cx="430" cy="140" r="2.6" fill="#dcdce2"/><circle cx="422" cy="143" r="2.6" fill="#dcdce2"/><text x="455" y="142" font-size="18.5" class="b">Session cookie</text><text x="455" y="168" font-size="13" class="m mut">no HttpOnly flag</text><rect x="395" y="184" width="56" height="22" rx="11" fill="#dcdce2" fill-opacity=".15" stroke="#dcdce2" stroke-opacity=".6"/><text x="406" y="199.5" font-size="12" class="b" style="fill:#dcdce2" letter-spacing="1">HIGH</text><rect x="720" y="100" width="250" height="118" rx="18" fill="#fff" style="animation:ap2 10.0s linear infinite" stroke="#fff" stroke-opacity=".14" stroke-width="1.6" fill-opacity=".05"/><circle cx="770" cy="130" r="9" stroke="#ffffff" stroke-width="3" fill="none"/><path d="M752 156 q18 -22 36 0" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/><text x="800" y="142" font-size="18.5" class="b">Account takeover</text><text x="800" y="168" font-size="13" class="m mut">no password, no 2FA</text><rect x="740" y="184" width="91" height="22" rx="11" fill="#ffffff" fill-opacity=".15" stroke="#ffffff" stroke-opacity=".6"/><text x="751" y="199.5" font-size="12" class="b" style="fill:#ffffff" letter-spacing="1">CRITICAL</text><text x="845.0" y="244" text-anchor="middle" font-size="15" class="b" style="fill:#e9e9ee;animation:ap3 10.0s linear infinite">✓ chain broken — no takeover</text><text x="845.0" y="244" text-anchor="middle" font-size="15" class="b" style="fill:#ffffff;animation:ap4 10.0s linear infinite">✗ one click = full compromise</text><g style="animation:ap6 10.0s linear infinite;transform-box:fill-box;transform-origin:center"><circle cx="290" cy="159.0" r="6.5" fill="#ffffff"/><circle cx="290" cy="159.0" r="13" fill="#ffffff" fill-opacity=".25"/></g><g style="animation:ap7 10.0s linear infinite;transform-box:fill-box;transform-origin:center"><ci