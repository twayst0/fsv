name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements-dev.txt
      - name: Compile check
        run: python -m compileall -q fsv
      - name: Tests
        env:
          # DNS-based modules would hit the network; keep CI hermetic
          FSV_DISABLED_MODULES: subdomain,dns_security
        run: python -m pytest -q
      - name: CLI smoke
        run: |
          fsv --version
          fsv modules --json > /dev/null
